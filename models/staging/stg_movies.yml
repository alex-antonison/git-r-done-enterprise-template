version: 2
models:
  - name: stg_movies
    description: Staging model for movie-level attributes and performance metrics, cleaned up and typed from the raw movie source.
    columns:
      - name: movie_id
        description: Surrogate identifier for a movie record, assigned by row order.
        data_type: bigint
      - name: title
        description: Movie title. Extracted with json_extract_string to strip JSON quoting from titles that look numeric (e.g. "1984") and would otherwise infer as JSON instead of varchar in the raw source.
        data_type: varchar
      - name: us_gross
        description: Total box office gross in the United States in USD.
        data_type: bigint
      - name: worldwide_gross
        description: Total worldwide box office gross in USD.
        data_type: bigint
      - name: us_dvd_sales
        description: Total US DVD sales revenue in USD.
        data_type: bigint
      - name: production_budget
        description: Estimated production budget in USD.
        data_type: bigint
      - name: release_date
        description: Theatrical release date, parsed into a real date from the raw formatted string.
        data_type: date
      - name: mpaa_rating
        description: MPAA age/content rating for the movie.
        data_type: varchar
      - name: running_time_min
        description: Runtime of the movie in minutes.
        data_type: bigint
      - name: distributor
        description: Company responsible for distribution.
        data_type: varchar
      - name: source
        description: Original data source for the movie record.
        data_type: varchar
      - name: major_genres
        description: Primary genre classification for the movie.
        data_type: varchar
      - name: creative_type
        description: Creative format/category of the movie content.
        data_type: varchar
      - name: director
        description: Director credited for the movie.
        data_type: varchar
      - name: rotten_tomatoes_rating
        description: Rotten Tomatoes critic score for the movie.
        data_type: bigint
      - name: imdb_rating
        description: IMDb user rating for the movie.
        data_type: double
      - name: imdb_votes
        description: Number of IMDb user votes used to calculate the IMDb rating.
        data_type: bigint
